id: events_inquiry
title: 'Events Inquiry'
description: ''
categories: {  }
elements: |-
  intro:
    '#type': webform_markup
    '#markup': '<h2>Make an Inquiry</h2><p>Kindly enter your contact information and preferences below. A member of our team will contact you shortly.</p>'
  booking_header:
    '#type': webform_markup
    '#markup': '<p>Booking Details</p>'
  booking_details:
    '#type': container
    flexbox:
      '#type': webform_flexbox
      type_of_event:
        '#type': select
        '#title': 'Type of Event'
        '#options':
          weddings_engagements: 'Weddings & Engagements'
          corporate_meetings: 'Corporate Meetings & Conferences'
          grand_events: 'Grand Events & Celebrations'
        '#required': true
      preferred_date:
        '#type': date
        '#title': 'Preferred Date'
        '#required': true
      preferred_time:
        '#type': webform_time
        '#title': 'Preferred Time'
        '#required': true
      days_of_duration:
        '#type': number
        '#title': 'Days of Duration'
        '#required': true
        '#default_value': '1'
        '#min': 1
    flexbox_01:
      '#type': webform_flexbox
      no_of_attendees:
        '#type': number
        '#title': 'No. of Attendees'
        '#required': true
        '#default_value': '0'
        '#min': 0
      referral_code:
        '#type': textfield
        '#title': 'Referral Code'
  personal_details:
    '#type': webform_markup
    '#markup': '<p>Personal Details</p>'
  perosnal_details_container:
    '#type': container
    personal_flexbox_1:
      '#type': webform_flexbox
      salutation:
        '#type': select
        '#title': Salutation
        '#options':
          Mr.: MR.
          Ms.: MS.
        '#required': true
        '#required_error': 'Please enter salutation!'
      name:
        '#type': textfield
        '#title': Name
        '#placeholder': 'Enter your full name'
        '#required': true
        '#required_error': 'Please enter name!'
        '#pattern': '^[A-Za-z]+(?:\s[A-Za-z]+)*$'
      email_address:
        '#type': email
        '#title': 'Email Address'
        '#placeholder': 'Enter your email address'
        '#required': true
        '#required_error': 'Please enter email address!'
      contact_number:
        '#type': tel
        '#title': 'Contact Number'
        '#placeholder': 'Enter your phone number'
        '#required': true
        '#required_error': 'Please enter contact number!'
        '#international': true
        '#international_initial_country': PH
    personal_flexbox_02:
      '#type': webform_flexbox
      message:
        '#type': textarea
        '#title': Message
  additional_details:
    '#type': container
    need_guest_rooms:
      '#type': checkbox
      '#title': 'Need Guest Rooms'
    event_date_is_flexible:
      '#type': checkbox
      '#title': 'Event Date is Flexible'
  privacy_flexbox:
    '#type': webform_flexbox
    privacy_policy:
      '#type': checkbox
      '#title': 'Privacy Policy'
      '#description': '<p>By supplying information via this form and clicking submit, I affirm that I have read, understood and hereby accept the terms of <a href="/privacy-policy" target="_blank">Solaire''s Privacy Policy</a> and that I hereby consent to the collection, storage, and processing by Solaire and any third party it authorizes, including its affiliates and their respective officers, employees, agents, representatives and personnel of such information disclosed.</p>'
      '#required': true
      '#required_error': 'User must agree to our Private Policy'
